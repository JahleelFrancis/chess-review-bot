name: Chess Review Bot Regression Harness
on:
  push:
    paths:
      - 'static/**'
      - 'tests/**'
      - 'scripts/**'
      - 'fixtures/**'
      - 'requirements-test-v2.txt'
      - '.github/workflows/chess-review-harness.yml'
  pull_request:
    paths:
      - 'static/**'
      - 'tests/**'
      - 'scripts/**'
      - 'fixtures/**'
      - 'requirements-test-v2.txt'
      - '.github/workflows/chess-review-harness.yml'
jobs:
  deterministic-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent chess oracle dependency
        run: python -m pip install -r requirements-test-v2.txt
      - name: Deterministic chess rules, tactical claims and engine-adapter invariants
        run: node scripts/v2/run-fast.cjs
      # Real Stockfish verification is opt-in and must have an explicit engine
      # binary/profile; the fake-engine adapter tests cannot replace it.
